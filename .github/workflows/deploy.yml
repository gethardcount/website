name: Deploy to GitHub Pages

# Builds the site on every pull request (a check only) and builds and deploys
# it on every push to main. The docs pages are synced from the hardcount repo
# at the release named in src/site.ts, so the site describes the version people
# download, not unreleased work on hardcount's main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Read the release the docs follow
        id: release
        run: |
          ref=$(sed -n "s/^export const RELEASE = '\(.*\)';/\1/p" src/site.ts)
          [ -n "$ref" ] || { echo "::error::src/site.ts names no RELEASE"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: gethardcount/hardcount
          ref: ${{ steps.release.outputs.ref }}
          path: .hc-src

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync the docs from hardcount at the release
        run: npm run sync
        env:
          HC_SRC: .hc-src
          HC_REF: ${{ steps.release.outputs.ref }}

      - run: npx astro build

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
